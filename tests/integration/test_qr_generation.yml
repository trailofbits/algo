---
- name: Verify secure WireGuard QR generation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    qr_user: "integration user"
    users:
      - "{{ qr_user }}"
    wireguard_users:
      - "{{ qr_user }}"
    IP_subject_alt_name: 203.0.113.7
    wireguard_network_ipv4: 10.49.0.0/24
    ipv6_support: false
    wireguard_dns_servers: 10.49.0.1
    wireguard_port: 51820
    wireguard_PersistentKeepalive: 0
    reduce_mtu: 0
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Create integration workspace
      tempfile:
        state: directory
        suffix: " qr path with spaces"
      register: qr_workspace

    - name: Exercise QR tasks and verify their result
      block:
        - name: Set test paths
          set_fact:
            wireguard_config_path: "{{ qr_workspace.path }}/config path with spaces"
            wireguard_pki_path: "{{ qr_workspace.path }}/pki path with spaces"

        - name: Create test key directories
          file:
            path: "{{ item }}"
            state: directory
            mode: "0700"
          loop:
            - "{{ wireguard_config_path }}"
            - "{{ wireguard_pki_path }}/private"
            - "{{ wireguard_pki_path }}/public"
            - "{{ wireguard_pki_path }}/preshared"

        - name: Write test key material
          copy:
            content: "{{ item.content }}\n"
            dest: "{{ item.dest }}"
            mode: "0600"
          loop:
            - dest: "{{ wireguard_pki_path }}/private/{{ qr_user }}"
              content: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
            - dest: "{{ wireguard_pki_path }}/public/{{ IP_subject_alt_name }}"
              content: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
            - dest: "{{ wireguard_pki_path }}/preshared/{{ qr_user }}"
              content: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC=
          no_log: true

        - name: Generate QR code through the role
          include_role:
            name: "{{ playbook_dir }}/../../roles/wireguard"
            tasks_from: qr

        - name: Inspect generated QR code
          stat:
            path: "{{ wireguard_config_path }}/{{ qr_user }}.png"
            checksum_algorithm: sha256
          register: qr_first

        - name: Read generated QR header
          slurp:
            src: "{{ wireguard_config_path }}/{{ qr_user }}.png"
          register: qr_png

        - name: Verify PNG signature and secure mode
          assert:
            that:
              - qr_first.stat.exists
              - qr_first.stat.isreg
              - qr_first.stat.mode == "0600"
              - qr_png.content is match('^iVBORw0KGgo')

        - name: Run QR generation a second time
          include_role:
            name: "{{ playbook_dir }}/../../roles/wireguard"
            tasks_from: qr

        - name: Inspect QR code after the second run
          stat:
            path: "{{ wireguard_config_path }}/{{ qr_user }}.png"
            checksum_algorithm: sha256
          register: qr_second

        - name: Verify QR generation is idempotent
          assert:
            that:
              - qr_second.stat.checksum == qr_first.stat.checksum
              - qr_second.stat.mtime == qr_first.stat.mtime

        - name: Replace QR output with a symlink attack fixture
          block:
            - name: Remove the generated QR output
              file:
                path: "{{ wireguard_config_path }}/{{ qr_user }}.png"
                state: absent

            - name: Create the symlink target
              copy:
                content: unchanged
                dest: "{{ qr_workspace.path }}/symlink-target"
                mode: "0600"

            - name: Point the QR output path at the target
              file:
                src: "{{ qr_workspace.path }}/symlink-target"
                dest: "{{ wireguard_config_path }}/{{ qr_user }}.png"
                state: link

        - name: Verify existing QR symlink fails closed
          block:
            - name: Attempt QR generation over an existing symlink
              include_role:
                name: "{{ playbook_dir }}/../../roles/wireguard"
                tasks_from: qr
          rescue:
            - name: Record QR symlink rejection
              set_fact:
                qr_symlink_rejected: true

        - name: Confirm QR symlink rejection
          assert:
            that: qr_symlink_rejected | default(false) | bool

        - name: Verify invalid QR output path fails closed
          block:
            - name: Select an invalid QR output path
              set_fact:
                wireguard_config_path: /proc/algo-invalid-qr-output

            - name: Attempt QR generation with invalid output
              include_role:
                name: "{{ playbook_dir }}/../../roles/wireguard"
                tasks_from: qr
          rescue:
            - name: Record invalid output rejection
              set_fact:
                qr_invalid_path_rejected: true

        - name: Confirm invalid output rejection
          assert:
            that: qr_invalid_path_rejected | default(false) | bool

      always:
        - name: Remove integration workspace
          file:
            path: "{{ qr_workspace.path }}"
            state: absent
