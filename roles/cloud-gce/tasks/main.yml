---
- name: Include prompts
  import_tasks: prompts.yml

- name: Derive a stable GCE network name for this deployment
  set_fact:
    gce_network_name: "algo-{{ ([project_id, algo_zone, algo_server_name] | join('/') | hash('sha256'))[:24] }}"

- name: Look for an existing instance before configuring the network
  gcp_compute_instance_info:
    auth_kind: serviceaccount
    service_account_file: "{{ credentials_file_path }}"
    project: "{{ project_id }}"
    zone: "{{ algo_zone }}"
    filters: ["name = {{ algo_server_name }}"]
  register: gce_existing

- name: Require a matching network before reusing an instance
  assert:
    that: >-
      not gce_existing.resources or
      (gce_existing.resources | length == 1 and
       gce_existing.resources[0].networkInterfaces[0].network | basename == gce_network_name)
    fail_msg: An instance with this name uses a different network. Choose a new deployment name or manage the existing server with update-users.

- name: Network configured
  gcp_compute_network:
    auth_kind: serviceaccount
    service_account_file: "{{ credentials_file_path }}"
    project: "{{ project_id }}"
    name: "{{ gce_network_name }}"
    auto_create_subnetworks: true
    routing_config:
      routing_mode: REGIONAL
  register: gcp_compute_network

- name: Firewall configured
  gcp_compute_firewall:
    auth_kind: serviceaccount
    service_account_file: "{{ credentials_file_path }}"
    project: "{{ project_id }}"
    name: "{{ gce_network_name }}"
    network: "{{ gcp_compute_network }}"
    direction: INGRESS
    target_tags: ["{{ gce_network_name }}"]
    allowed: >-
      {{ [{'ip_protocol': 'tcp', 'ports': [ssh_port | string]}, {'ip_protocol': 'icmp'}] +
         ([{'ip_protocol': 'udp', 'ports': (['500', '4500'] if ipsec_enabled | bool else []) +
              ([wireguard_port | string] if wireguard_enabled | bool else [])}]
          if ipsec_enabled | bool or wireguard_enabled | bool else []) }}
  register: gce_firewall

- when: cloud_providers.gce.external_static_ip
  block:
    - name: External IP allocated
      gcp_compute_address:
        auth_kind: serviceaccount
        service_account_file: "{{ credentials_file_path }}"
        project: "{{ project_id }}"
        name: "{{ gce_network_name }}"
        region: "{{ algo_region }}"
      register: gcp_compute_address

    - name: Set External IP as a fact
      set_fact:
        external_ip: "{{ gcp_compute_address.address }}"

- name: Instance created
  gcp_compute_instance:
    auth_kind: serviceaccount
    service_account_file: "{{ credentials_file_path }}"
    project: "{{ project_id }}"
    name: "{{ algo_server_name }}"
    zone: "{{ algo_zone }}"
    machine_type: "{{ cloud_providers.gce.size }}"
    disks:
      - auto_delete: true
        boot: true
        initialize_params:
          source_image: projects/ubuntu-os-cloud/global/images/family/{{ cloud_providers.gce.image }}
    metadata:
      ssh-keys: algo:{{ lookup('file', SSH_keys.public) }}
      user-data: "{{ lookup('template', 'files/cloud-init/base.yml') }}"
    network_interfaces:
      - network: "{{ gcp_compute_network }}"
        access_configs:
          - name: "{{ algo_server_name }}"
            nat_ip: "{{ gcp_compute_address | default(None) }}"
            type: ONE_TO_ONE_NAT
    tags:
      tag_values:
        - "{{ gce_network_name }}"
  register: gcp_compute_instance

- set_fact:
    gce_deployment:
      project: "{{ project_id }}"
      zone: "{{ algo_zone }}"
      region: "{{ algo_region }}"
      instance_id: "{{ gcp_compute_instance.id | string }}"
      network_name: "{{ gce_network_name }}"
      network_id: "{{ gcp_compute_network.id | string }}"
      firewall_id: "{{ gce_firewall.id | string }}"
      address_id: "{{ gcp_compute_address.id | default('') | string }}"
    cloud_instance_ip: "{{ gcp_compute_instance.networkInterfaces[0].accessConfigs[0].natIP }}"
    ansible_ssh_user: algo
    ansible_ssh_port: "{{ ssh_port }}"
    cloudinit: true
