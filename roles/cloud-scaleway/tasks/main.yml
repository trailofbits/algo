---
- name: Include prompts
  import_tasks: prompts.yml

- name: Determine the Scaleway zone and legacy compute alias
  set_fact:
    algo_scaleway_zone: "{{ scaleway_zone_map.get(algo_region, algo_region) }}"
    algo_scaleway_compute_alias: "{{ scaleway_compute_alias_map.get(algo_region, algo_region) }}"

- environment:
    SCW_TOKEN: "{{ algo_scaleway_token }}"
  block:
    - name: Get Ubuntu 22.04 image ID from Scaleway Marketplace API v2
      uri:
        url: >-
          https://api.scaleway.com/marketplace/v2/local-images?{{
            {'image_label': 'ubuntu_jammy', 'zone': algo_scaleway_zone,
             'arch': cloud_providers.scaleway.arch, 'type': 'instance_sbs',
             'page_size': 100} | urlencode }}
        method: GET
        return_content: true
      register: marketplace_images

    - name: Find compatible Ubuntu 22.04 Jammy images
      set_fact:
        scaleway_images: >-
          {{ marketplace_images.json.local_images |
              selectattr('arch', 'equalto', cloud_providers.scaleway.arch) |
              selectattr('compatible_commercial_types', 'contains', cloud_providers.scaleway.size) |
              selectattr('type', 'equalto', 'instance_sbs') |
              list }}

    - name: Check that Marketplace returned all matching images
      assert:
        that:
          - marketplace_images.json.total_count <= marketplace_images.json.local_images | length
        fail_msg: >-
          Scaleway Marketplace returned a truncated image list
          ({{ marketplace_images.json.local_images | length }} of
          {{ marketplace_images.json.total_count }} images).
          Report this response before deploying so image pagination can be updated.

    - name: Check that a compatible image is available
      assert:
        that:
          - scaleway_images | length > 0
        fail_msg: >-
          Cannot select an Ubuntu 22.04 image for {{ cloud_providers.scaleway.size }}
          ({{ cloud_providers.scaleway.arch }}) in {{ algo_scaleway_zone }}.
          Choose a zone and instance type with an available Marketplace image.

    - name: Select the Ubuntu image
      set_fact:
        scaleway_image_id: "{{ scaleway_images[0].id }}"

    - name: Create a server
      scaleway_compute:
        name: "{{ algo_server_name }}"
        enable_ipv6: true
        public_ip: dynamic
        boot_type: local
        state: present
        image: "{{ scaleway_image_id }}"
        organization: "{{ algo_scaleway_org_id }}"
        region: "{{ algo_scaleway_compute_alias }}"
        commercial_type: "{{ cloud_providers.scaleway.size }}"
        wait: true
        tags:
          - Environment:Algo
          - AUTHORIZED_KEY={{ lookup('file', SSH_keys.public) | regex_replace(' ', '_') }}
      register: scaleway_compute

    - name: Patch the cloud-init
      # Use the Instance API rather than the legacy cp-<alias>.scaleway.com
      # hosts, which only resolve in par1/ams1 and block other zones.
      uri:
        url: >-
          {{ 'https://api.scaleway.com/instance/v1/zones/' ~ algo_scaleway_zone ~
             '/servers/' ~ scaleway_compute.msg.id ~ '/user_data/cloud-init' }}
        method: PATCH
        body: "{{ lookup('template', 'files/cloud-init/base.yml') }}"
        status_code: 204
        headers:
          Content-Type: text/plain
          X-Auth-Token: "{{ algo_scaleway_token }}"

    - name: Start the server
      scaleway_compute:
        name: "{{ algo_server_name }}"
        enable_ipv6: true
        public_ip: dynamic
        boot_type: local
        state: running
        image: "{{ scaleway_image_id }}"
        organization: "{{ algo_scaleway_org_id }}"
        region: "{{ algo_scaleway_compute_alias }}"
        commercial_type: "{{ cloud_providers.scaleway.size }}"
        wait: true
        tags:
          - Environment:Algo
          - AUTHORIZED_KEY={{ lookup('file', SSH_keys.public) | regex_replace(' ', '_') }}
      register: algo_instance
      until:
        - algo_instance.msg.public_ip is defined
        - algo_instance.msg.public_ip is not none
        - algo_instance.msg.public_ip.address | default('') | length > 0
      retries: 3
      delay: 3

- set_fact:
    cloud_instance_ip: "{{ algo_instance.msg.public_ip.address }}"
    ansible_ssh_user: algo
    ansible_ssh_port: "{{ ssh_port }}"
    cloudinit: true
