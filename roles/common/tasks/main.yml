---
- name: Check the system
  raw: uname -a
  register: OS
  changed_when: false
  tags:
    - update-users

- fail:
  when: cloud_test|default(false)|bool

- name: Gather platform facts
  setup:
  tags:
    - always
    - update-users

- name: Verify the server platform is supported
  assert:
    that: ansible_distribution == 'Ubuntu' and ansible_distribution_version in ['22.04', '24.04']
    fail_msg: Algo supports only Ubuntu 22.04 LTS and Ubuntu 24.04 LTS.
  tags:
    - always
    - update-users

- include_tasks: ubuntu.yml

# Include facts separately - always runs to ensure OS detection facts are available
- include_tasks: facts.yml
  tags:
    - always
    - update-users

- name: Sysctl tuning
  sysctl: name="{{ item.item }}" value="{{ item.value }}"
  when: item.item is defined and item.item != none
  loop: "{{ sysctl | default([]) }}"
  tags:
    - always

- meta: flush_handlers
