---
- name: Read Oracle instance service firewall rules
  # Preserve the image's storage access restrictions using its active backend.
  command:
    argv:
      - iptables-save
      - -t
      - filter
  register: _oracle_iptables_filter
  changed_when: false
  check_mode: false
  when: algo_provider == 'oracle'

- name: Iptables configured
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0640'
  loop:
    - { src: rules.v4.j2, dest: /etc/iptables/rules.v4 }
  notify:
    - restart iptables

- name: Iptables configured
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0640'
  when: ipv6_support | bool
  loop:
    - { src: rules.v6.j2, dest: /etc/iptables/rules.v6 }
  notify:
    - restart iptables
