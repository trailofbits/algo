---
- name: Ask for the Linode API token
  pause:
    prompt: |
      Enter your ACCESS token. (https://developers.linode.com/api/v4/#access-and-authentication):
    echo: false
  register: _linode_token
  when:
    - linode_token is undefined
    - lookup('env', 'LINODE_API_TOKEN') | length <= 0
  no_log: true

- name: Set the token as a fact
  set_fact:
    algo_linode_token: >-
      {{ linode_token | default(_linode_token.user_input | default(None))
         | default(lookup('env', 'LINODE_API_TOKEN'), true) }}
  no_log: true
