---
- pause:
    prompt: |
      Enter your API token (https://trailofbits.github.io/algo/cloud-hetzner.html#api-token):
    echo: false
  register: _hcloud_token
  when:
    - hcloud_token is undefined
    - lookup('env', 'HCLOUD_TOKEN')|length <= 0
  no_log: true

- name: Set the token as a fact
  set_fact:
    algo_hcloud_token: "{{ hcloud_token | default(_hcloud_token.user_input | default(None)) | default(lookup('env', 'HCLOUD_TOKEN'), true) }}"
  no_log: true

- name: Get locations
  hetzner.hcloud.location_info:
    api_token: "{{ algo_hcloud_token }}"
  register: _hcloud_regions

- name: Set facts about the regions
  set_fact:
    hcloud_regions: "{{ _hcloud_regions.hcloud_location_info | sort(attribute='name') }}"

- name: Check that Hetzner returned locations
  assert:
    that: hcloud_regions | length > 0
    fail_msg: Hetzner returned no locations. Check your API token and try again.

- name: Set default region
  set_fact:
    default_region: >-
      {{ (hcloud_regions | map(attribute='name') | list).index('nbg1') + 1
         if 'nbg1' in (hcloud_regions | map(attribute='name') | list) else 1 }}

- pause:
    prompt: |
      What region should the server be located in?
        {% for r in hcloud_regions %}
        {{ loop.index }}. {{ r['name'] }}     {{ r['description'] }}
        {% endfor %}

      Enter the number of your desired region
      [{{ default_region }}]
  register: _algo_region
  when: region is undefined

- name: Validate the selected location number
  assert:
    that:
      - _algo_region.user_input is match('^[0-9]+$')
      - _algo_region.user_input | int >= 1
      - _algo_region.user_input | int <= hcloud_regions | length
    fail_msg: "Enter a location number from 1 to {{ hcloud_regions | length }}."
  when:
    - region is undefined
    - _algo_region.user_input | default('') | length > 0

- name: Set additional facts
  set_fact:
    algo_hcloud_region: >-
      {%- if region is defined -%}{{ region }}{%-
      elif _algo_region.user_input -%}{{ hcloud_regions[_algo_region.user_input | int - 1]['name'] }}{%-
      else -%}{{ hcloud_regions[default_region | int - 1]['name'] }}{%-
      endif -%}
