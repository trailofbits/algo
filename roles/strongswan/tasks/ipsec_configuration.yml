---
- name: Setup common StrongSwan configuration
  template:
    src: "{{ item.src }}"
    dest: "{{ config_prefix | default('/') }}etc/{{ item.dest }}"
    owner: root
    group: "{{ root_group | default('root') }}"
    mode: "0644"
  loop:
    - src: strongswan.conf.j2
      dest: strongswan.conf
    - src: charon.conf.j2
      dest: strongswan.d/charon.conf
  notify: reload systemd and restart strongswan

- name: Setup starter configuration
  template:
    src: "{{ item.src }}"
    dest: "{{ config_prefix | default('/') }}etc/{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ root_group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - src: ipsec.conf.j2
      dest: ipsec.conf
      owner: root
      mode: "0644"
    - src: ipsec.secrets.j2
      dest: ipsec.secrets
      owner: strongswan
      mode: "0600"
  when: strongswan_backend == 'starter'
  notify: reload systemd and restart strongswan

- name: Setup secure swanctl configuration
  template:
    src: swanctl.conf.j2
    dest: "{{ config_prefix | default('/') }}etc/swanctl/swanctl.conf"
    owner: root
    group: "{{ root_group | default('root') }}"
    mode: "0600"
  when: strongswan_backend == 'swanctl'
  notify:
    - reload systemd and restart strongswan
    - reload swanctl configuration

- name: Get loaded plugins
  shell: |
    set -o pipefail
    find {{ config_prefix | default('/') }}etc/strongswan.d/charon/ -type f -name '*.conf' -exec basename {} \; |
    cut -f1 -d.
  changed_when: false
  args:
    executable: bash
  register: strongswan_plugins

- name: Disable unneeded plugins
  lineinfile:
    dest: "{{ config_prefix | default('/') }}etc/strongswan.d/charon/{{ item }}.conf"
    regexp: .*load.*
    line: load = no
    state: present
  notify: reload systemd and restart strongswan
  when: item not in strongswan_enabled_plugins and item not in strongswan_additional_plugins
  loop: "{{ strongswan_plugins.stdout_lines }}"

- name: Ensure that required plugins are enabled
  lineinfile:
    dest: "{{ config_prefix | default('/') }}etc/strongswan.d/charon/{{ item }}.conf"
    regexp: '.*load.*'
    line: load = yes
    state: present
  notify: reload systemd and restart strongswan
  when: item in strongswan_enabled_plugins or item in strongswan_additional_plugins
  loop: "{{ strongswan_plugins.stdout_lines }}"
