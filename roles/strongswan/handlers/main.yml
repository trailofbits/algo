---
- name: reload systemd and restart strongswan
  systemd:
    name: "{{ strongswan_service }}"
    daemon_reload: true
    state: restarted

- name: reload swanctl configuration
  command: swanctl --load-all --noprompt
  when: strongswan_backend == 'swanctl'
  changed_when: false
  no_log: true

- name: restart apparmor
  service: name=apparmor state=restarted

- name: rereadcrls
  shell: |
    # Check if StrongSwan is actually running
    if ! systemctl is-active --quiet strongswan-starter 2>/dev/null && \
       ! systemctl is-active --quiet strongswan 2>/dev/null && \
       ! service strongswan status >/dev/null 2>&1; then
      echo "StrongSwan is not running, skipping CRL reload"
      exit 0
    fi

    sleep 2
    for attempt in 1 2 3; do
      if [[ "{{ strongswan_backend }}" == "swanctl" ]]; then
        reload_command="swanctl --load-authorities --noprompt"
      else
        reload_command="ipsec rereadcrls && ipsec purgecrls"
      fi
      if eval "${reload_command}" 2>/dev/null; then
        echo "Successfully reloaded CRLs"
        exit 0
      fi
      echo "Attempt $attempt failed, retrying..."
      sleep 2
    done

    echo "Failed to reload CRLs after 3 attempts"
    exit 1
  args:
    executable: bash
  changed_when: false
