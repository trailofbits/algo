---
- name: Include prompts
  import_tasks: prompts.yml

- import_tasks: inventory.yml

- name: Check ownership before reusing names in a nonempty Azure group
  when: azure_existing_ids | length > 0
  block:
    - name: Read the previous Algo deployment record
      azure.azcollection.azure_rm_resource_info:
        url: >-
          /subscriptions/{{ subscription_id }}/resourceGroups/{{ algo_server_name }}/providers/Microsoft.Resources/deployments/{{ algo_server_name }}
        api_version: "2021-04-01"
        secret: "{{ secret | default(omit, true) }}"
        tenant: "{{ tenant | default(omit, true) }}"
        client_id: "{{ client_id | default(omit, true) }}"
        subscription_id: "{{ subscription_id }}"
      register: azure_previous

    - name: Require a recorded Algo deployment to own every existing resource
      assert:
        that:
          - azure_previous.status_code == 200
          - azure_existing_ids | difference(azure_previous.response[0].properties.outputs.algoResourceIds.value | default([]) | map('lower')) | length == 0
        fail_msg: Select an unused resource group or verify and migrate the existing Azure deployment first.

- name: Create AlgoVPN Server
  azure.azcollection.azure_rm_deployment:
    state: present
    deployment_name: "{{ algo_server_name }}"
    template: "{{ lookup('template', role_path + '/templates/deployment.json.j2') | from_json }}"
    secret: "{{ secret | default(omit, true) }}"
    tenant: "{{ tenant | default(omit, true) }}"
    client_id: "{{ client_id | default(omit, true) }}"
    subscription_id: "{{ subscription_id }}"
    resource_group_name: "{{ algo_server_name }}"
    location: "{{ algo_region }}"
    parameters:
      sshKeyData:
        value: "{{ lookup('file', SSH_keys.public) }}"
      WireGuardPort:
        value: "{{ wireguard_port }}"
      vmSize:
        value: "{{ cloud_providers.azure.size }}"
      imageReferencePublisher:
        value: "{{ cloud_providers.azure.image.publisher }}"
      imageReferenceOffer:
        value: "{{ cloud_providers.azure.image.offer }}"
      imageReferenceSku:
        value: "{{ cloud_providers.azure.image.sku }}"
      imageReferenceVersion:
        value: "{{ cloud_providers.azure.image.version }}"
      osDiskType:
        value: "{{ cloud_providers.azure.osDisk.type }}"
      SshPort:
        value: "{{ ssh_port }}"
      UserData:
        value: "{{ lookup('template', 'files/cloud-init/base.yml') | b64encode }}"
  register: azure_rm_deployment

- set_fact:
    azure_resource_ids: "{{ azure_rm_deployment.deployment.outputs.algoResourceIds.value }}"
    cloud_instance_ip: "{{ azure_rm_deployment.deployment.outputs.publicIPAddresses.value }}"
    ansible_ssh_user: algo
    ansible_ssh_port: "{{ ssh_port }}"
    cloudinit: true
