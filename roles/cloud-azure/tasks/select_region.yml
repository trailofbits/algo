---
- name: Validate the Azure region menu selection
  assert:
    that:
      - azure_region_choice is match('^[0-9]+$')
      - azure_region_choice | int >= 1
      - azure_region_choice | int <= azure_regions | length
    fail_msg: >-
      Invalid Azure region selection '{{ azure_region_choice }}'.
      Enter a number from 1 to {{ azure_regions | length }}.
  vars:
    azure_region_choice: "{{ _algo_region.user_input | default('') | trim or default_region | string }}"
  when: region is undefined

- name: Select the Azure region
  set_fact:
    algo_region: >-
      {{ region if region is defined else
         azure_regions[(azure_region_choice | int) - 1]['name'] }}
  vars:
    azure_region_choice: "{{ _algo_region.user_input | default('') | trim or default_region | string }}"

- name: Validate the requested Azure region
  assert:
    that: algo_region in (azure_regions | map(attribute='name') | list)
    fail_msg: >-
      Azure region '{{ algo_region }}' is not an available physical region for
      subscription {{ subscription_id }}. Choose one of:
      {{ azure_regions | map(attribute='name') | join(', ') }}.
