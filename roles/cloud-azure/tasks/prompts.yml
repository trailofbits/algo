---
- name: Read Azure authentication settings
  import_tasks: auth.yml

- name: List regions for the Azure subscription
  azure.azcollection.azure_rm_resource_info:
    url: "/subscriptions/{{ subscription_id }}/locations"
    api_version: '2022-12-01'
    secret: "{{ secret | default(omit, true) }}"
    tenant: "{{ tenant | default(omit, true) }}"
    client_id: "{{ client_id | default(omit, true) }}"
    subscription_id: "{{ subscription_id }}"
  register: azure_locations

- name: Prepare the Azure region choices
  import_tasks: regions.yml

- name: Choose an Azure region
  pause:
    prompt: |
      What region should the server be located in?
        {% for r in azure_regions %}
        {{ loop.index }}. {{ r['regionalDisplayName'] }}
        {% endfor %}

      Enter the number of your desired region
      [{{ default_region }}]
  register: _algo_region
  when: region is undefined

- name: Validate and select the Azure region
  import_tasks: select_region.yml
