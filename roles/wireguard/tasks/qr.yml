---
- name: Generate the QR image when its contents or permissions change
  algo_wireguard_qr:
    config_path: "{{ wireguard_config_path }}/{{ item }}.conf"
    image_path: "{{ wireguard_config_path }}/{{ item }}.png"
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  loop: "{{ wireguard_users }}"
  when: item in users
  no_log: true
