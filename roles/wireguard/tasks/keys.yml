---
- name: Ensure the WireGuard pki directory does not exist
  file:
    dest: "{{ wireguard_pki_path }}"
    state: absent
  when: keys_clean_all | bool

- name: Ensure the WireGuard pki directories exist
  file:
    dest: "{{ wireguard_pki_path }}/{{ item }}"
    state: directory
    recurse: true
    mode: "0700"
  loop:
    - preshared
    - private
    - public

- name: Generate raw private keys
  community.crypto.openssl_privatekey:
    type: X25519
    path: "{{ wireguard_pki_path }}/private/{{ item }}.raw"
    format: raw
    mode: "0600"
  loop: "{{ users + [IP_subject_alt_name] }}"

- name: Read raw private keys without text decoding
  slurp:
    src: "{{ wireguard_pki_path }}/private/{{ item }}.raw"
  loop: "{{ users + [IP_subject_alt_name] }}"
  register: wireguard_private_keys
  no_log: true

- name: Save base64 encoded private key
  copy:
    dest: "{{ wireguard_pki_path }}/private/{{ item.item }}"
    content: "{{ item.content }}"
    mode: "0600"
  loop: "{{ wireguard_private_keys.results }}"
  no_log: true

- name: Generate raw preshared keys
  community.crypto.openssl_privatekey:
    type: X25519
    path: "{{ wireguard_pki_path }}/preshared/{{ item }}.raw"
    format: raw
    mode: "0600"
  loop: "{{ users + [IP_subject_alt_name] }}"

- name: Read raw preshared keys without text decoding
  slurp:
    src: "{{ wireguard_pki_path }}/preshared/{{ item }}.raw"
  loop: "{{ users + [IP_subject_alt_name] }}"
  register: wireguard_preshared_keys
  no_log: true

- name: Save base64 encoded preshared keys
  copy:
    dest: "{{ wireguard_pki_path }}/preshared/{{ item.item }}"
    content: "{{ item.content }}"
    mode: "0600"
  loop: "{{ wireguard_preshared_keys.results }}"
  no_log: true

- name: Generate public keys
  x25519_pubkey:
    private_key_path: "{{ wireguard_pki_path }}/private/{{ item }}.raw"
    public_key_path: "{{ wireguard_pki_path }}/public/{{ item }}"
  loop: "{{ users + [IP_subject_alt_name] }}"
  no_log: true

- name: Set permissions for public keys
  file:
    path: "{{ wireguard_pki_path }}/public/{{ item }}"
    mode: '0644'
  loop: "{{ users + [IP_subject_alt_name] }}"
  no_log: true
