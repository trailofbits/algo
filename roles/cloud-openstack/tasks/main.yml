---
- fail:
    msg: >-
      OpenStack credentials are not set. Download it from the OpenStack dashboard->Compute->API Access
      and source it in the shell (eg: source /tmp/dhc-openrc.sh), or set OS_CLOUD
      to a configured cloud in clouds.yaml.
  when:
    - lookup('env', 'OS_AUTH_URL') | length == 0
    - lookup('env', 'OS_CLOUD') | length == 0

- name: Gather facts about flavors
  openstack.cloud.compute_flavor_info:
    ram: "{{ cloud_providers.openstack.flavor_ram }}"
  register: os_flavor

- name: Gather facts about images
  openstack.cloud.image_info:
  register: os_image

- name: Select active images with the configured name
  set_fact:
    openstack_images: >-
      {{ os_image.images |
         selectattr('name', 'equalto', cloud_providers.openstack.image) |
         selectattr('status', 'equalto', 'active') | list }}

- name: Validate the OpenStack image and flavor selection
  assert:
    that:
      - openstack_images | length == 1
      - os_flavor.flavors | length > 0
    fail_msg: >-
      OpenStack must provide exactly one active image named
      {{ cloud_providers.openstack.image }} and a flavor matching RAM
      {{ cloud_providers.openstack.flavor_ram }}. Check the image name,
      flavor filter, and project access in config.cfg and your cloud credentials.

- name: Gather facts about public networks
  openstack.cloud.networks_info:
  register: os_network

- name: Select active external networks
  set_fact:
    openstack_networks: >-
      {{ os_network.networks |
         selectattr('is_router_external', 'equalto', true) |
         selectattr('is_admin_state_up', 'equalto', true) |
         selectattr('status', 'equalto', 'ACTIVE') | list }}

- name: Validate the OpenStack network selection
  assert:
    that:
      - openstack_networks | length == 1
    fail_msg: >-
      OpenStack must expose exactly one active external network to this project.
      Found {{ openstack_networks | length }}. Check network status and project access.

- name: Security group created
  openstack.cloud.security_group:
    state: "{{ state | default('present') }}"
    name: "{{ algo_server_name }}-security_group"
    description: AlgoVPN security group
  register: os_security_group

- name: Security rules created
  openstack.cloud.security_group_rule:
    state: >-
      {{ state | default('present')
         if item.proto != 'udp' or item.port_min | int in vpn_ports else 'absent' }}
    security_group: "{{ os_security_group.security_group.id }}"
    protocol: "{{ item.proto }}"
    port_range_min: "{{ item.port_min }}"
    port_range_max: "{{ item.port_max }}"
    remote_ip_prefix: "{{ item.range }}"
  vars:
    vpn_ports: >-
      {{ ([wireguard_port | int] if wireguard_enabled | bool else []) +
         ([500, 4500] if ipsec_enabled | bool else []) }}
  loop:
    - { proto: tcp, port_min: "{{ ssh_port }}", port_max: "{{ ssh_port }}", range: 0.0.0.0/0 }
    - { proto: icmp, port_min: -1, port_max: -1, range: 0.0.0.0/0 }
    - { proto: udp, port_min: 4500, port_max: 4500, range: 0.0.0.0/0 }
    - { proto: udp, port_min: 500, port_max: 500, range: 0.0.0.0/0 }
    - { proto: udp, port_min: "{{ wireguard_port }}", port_max: "{{ wireguard_port }}", range: 0.0.0.0/0 }

- name: Set facts
  set_fact:
    image_id: "{{ openstack_images[0].id }}"
    public_network_id: "{{ openstack_networks[0].id }}"
    flavor_id: >-
      {{ (os_flavor.flavors | sort(attribute='id') | sort(attribute='ram'))[0].id }}
    security_group_name: "{{ os_security_group.security_group.name }}"

- name: Server created
  openstack.cloud.server:
    state: "{{ state | default('present') }}"
    name: "{{ algo_server_name }}"
    image: "{{ image_id }}"
    flavor: "{{ flavor_id }}"
    security_groups: "{{ security_group_name }}"
    userdata: "{{ lookup('template', 'files/cloud-init/base.yml') }}"
    nics:
      - net-id: "{{ public_network_id }}"
  register: os_server

- name: Find the server's floating and external IPv4 addresses
  set_fact:
    openstack_floating_ipv4: >-
      {{ os_server.server.addresses.values() | flatten |
         selectattr('version', 'equalto', 4) |
         selectattr('OS-EXT-IPS:type', 'defined') |
         selectattr('OS-EXT-IPS:type', 'equalto', 'floating') |
         map(attribute='addr') | list }}
    openstack_external_ipv4: >-
      {{ os_server.server.addresses.get(openstack_networks[0].name, []) |
         selectattr('version', 'equalto', 4) | map(attribute='addr') | list }}

- name: Require an IPv4 endpoint for the OpenStack server
  assert:
    that:
      - (openstack_floating_ipv4 + openstack_external_ipv4) | length > 0
    fail_msg: >-
      OpenStack created {{ algo_server_name }} without a floating or external IPv4 address.
      Check the external network's IPv4 subnet and floating IP quota before retrying.

- set_fact:
    cloud_instance_ip: "{{ (openstack_floating_ipv4 + openstack_external_ipv4)[0] }}"
    ansible_ssh_user: algo
    ansible_ssh_port: "{{ ssh_port }}"
    cloudinit: true
