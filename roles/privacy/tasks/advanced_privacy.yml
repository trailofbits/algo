---
- name: Apply the kernel privacy settings from a dedicated file
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-privacy.conf
    state: present
    reload: true
  loop:
    - { name: kernel.printk, value: '3 4 1 3' }
    - { name: kernel.dmesg_restrict, value: '1' }
  when: privacy_advanced.reduce_kernel_verbosity | bool

- name: Ensure journal drop-in directory exists
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'

- name: Configure journal retention in an Algo-owned file
  copy:
    dest: /etc/systemd/journald.conf.d/99-algo-privacy.conf
    mode: '0644'
    content: |
      [Journal]
      Storage=volatile
      MaxRetentionSec={{ privacy_log_rotation.max_age }}day
      MaxFileSec=1day
      SystemMaxUse=100M
      SystemMaxFileSize={{ privacy_log_rotation.max_size }}M
      ForwardToSyslog=no
  notify: restart systemd-journald

- name: Set up privacy monitoring script
  template:
    src: privacy-monitor.sh.j2
    dest: /usr/local/bin/privacy-monitor.sh
    mode: '0755'
    owner: root
    group: root

- name: Display privacy configuration summary
  debug:
    msg:
      - "Privacy enhancements applied:"
      - "  - Log retention: {{ privacy_log_rotation.max_age }} days"
      - "  - VPN log filtering: {{ privacy_log_filtering.exclude_vpn_logs | bool }}"
      - "  - History clearing: {{ privacy_history_clearing.clear_bash_history | bool }}"
      - "  - Auto cleanup: {{ privacy_auto_cleanup.enabled | bool }}"
      - "  - Kernel verbosity reduction: {{ privacy_advanced.reduce_kernel_verbosity | bool }}"
