---
name: 'Setup Python and uv'
description: 'Install the pinned Python and uv tools for Algo VPN CI'
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.11'
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        enable-cache: true
        version: '0.13.7'
