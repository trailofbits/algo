---
name: 'Setup Python and uv'
description: 'Install the pinned Python and uv tools for Algo VPN CI'
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.11'
    - name: Install uv
      uses: astral-sh/setup-uv@1ddb97e5078301c0bec13b38151f8664ed04edc8  # v6
      with:
        enable-cache: true
        version: '0.13.7'
