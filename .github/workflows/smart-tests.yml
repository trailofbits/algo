---
name: Smart Test Selection

'on':
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changed-files:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      # Define what tests to run based on changes
      run_syntax_check: ${{ steps.filter.outputs.ansible }}
      run_basic_tests: ${{ steps.filter.outputs.python }}
      run_docker_tests: ${{ steps.filter.outputs.docker }}
      run_config_tests: ${{ steps.filter.outputs.configs }}
      run_template_tests: ${{ steps.filter.outputs.templates }}
      run_lint: ${{ steps.filter.outputs.lint }}
      run_integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            ansible:
              - '**/*.yml'
              - '**/*.yaml'
              - 'main.yml'
              - 'playbooks/**'
              - 'roles/**'
              - 'library/**'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/**'
            docker:
              - 'Dockerfile*'
              - '.dockerignore'
              - 'docker-compose*.yml'
            configs:
              - 'config.cfg*'
              - 'roles/**/templates/**'
              - 'roles/**/defaults/**'
            templates:
              - '**/*.j2'
              - 'roles/**/templates/**'
            lint:
              - '**/*.py'
              - '**/*.yml'
              - '**/*.yaml'
              - '**/*.sh'
              - '**/*.j2'
              - '.ansible-lint'
              - '.yamllint'
              - 'pyproject.toml'
            integration:
              - 'main.yml'
              - 'roles/**'
              - 'library/**'
              - 'playbooks/**'

  syntax-check:
    name: Ansible Syntax Check
    needs: changed-files
    if: needs.changed-files.outputs.run_syntax_check == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv

      - name: Check Ansible playbook syntax
        run: uv run ansible-playbook main.yml --syntax-check

  basic-tests:
    name: Basic Sanity Tests
    needs: changed-files
    if: needs.changed-files.outputs.run_basic_tests == 'true' || needs.changed-files.outputs.run_template_tests == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run relevant tests
        env:
          RUN_BASIC_TESTS: ${{ needs.changed-files.outputs.run_basic_tests }}
          RUN_TEMPLATE_TESTS: ${{ needs.changed-files.outputs.run_template_tests }}
        run: |
          # Always run basic sanity
          uv run pytest tests/unit/test_basic_sanity.py -v

          # Run other tests based on what changed
          if [[ "${RUN_BASIC_TESTS}" == "true" ]]; then
            uv run pytest \
              tests/unit/test_config_validation.py \
              tests/unit/test_user_management.py \
              tests/unit/test_openssl_compatibility.py \
              tests/unit/test_cloud_provider_configs.py \
              tests/unit/test_generated_configs.py \
              -v
          fi

          if [[ "${RUN_TEMPLATE_TESTS}" == "true" ]]; then
            uv run pytest tests/unit/test_template_rendering.py -v
          fi

  docker-tests:
    name: Docker Build Test
    needs: changed-files
    if: needs.changed-files.outputs.run_docker_tests == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv

      - name: Build Docker image
        run: docker build -t local/algo:test .

      - name: Test Docker image starts
        run: |
          docker run --rm local/algo:test /algo/algo --help

      - name: Run Docker deployment tests
        run: uv run pytest tests/unit/test_docker_localhost_deployment.py -v

  config-tests:
    name: Configuration Tests
    needs: changed-files
    if: needs.changed-files.outputs.run_config_tests == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv

      - name: Test configuration generation
        run: |
          chmod +x tests/test-local-config.sh
          ./tests/test-local-config.sh

      - name: Run ansible dry-run tests
        run: |
          # Quick dry-run for local provider only
          cat > test-local.cfg << 'EOF'
          users:
            - testuser
          cloud_providers:
            local:
              server: test-server
          wireguard_enabled: true
          ipsec_enabled: false
          dns_adblocking: false
          ssh_tunneling: false
          algo_provider: local
          algo_server_name: test-algo-vpn
          server: test-server
          endpoint: 10.0.0.1
          EOF

          uv run ansible-playbook main.yml \
            -i "localhost," \
            -c local \
            -e @test-local.cfg \
            -e "provider=local" \
            --check \
            --diff \
            -vv \
            --skip-tags "facts,tests,local,update-alternatives,cloud_api"

  lint:
    name: Linting
    needs: changed-files
    if: needs.changed-files.outputs.run_lint == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv

      - name: Install ansible dependencies
        run: uv run ansible-galaxy collection install community.crypto

      - name: Run relevant linters
        env:
          RUN_LINT: ${{ needs.changed-files.outputs.run_lint }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Run linters if lint-related files changed
          if [[ "${RUN_LINT}" == "true" ]]; then
            echo "Running linters..."

            # Run Python linter
            uv run --with ruff ruff check .

            # Run YAML linter
            uv run --with yamllint yamllint -c .yamllint .

            # Run Ansible linter
            uv run --with ansible-lint ansible-lint

            # Check Jinja2 templates
            if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -q '\.j2$'; then
              uv run --with j2lint j2lint roles/ --ignore S3 S5 S6 S7 V1
            fi

            # Check shell scripts if any changed
            if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -q '\.sh$'; then
              find . -name "*.sh" -type f -not -path "./.git/*" -exec shellcheck {} +
            fi
          fi

  all-tests-required:
    name: All Required Tests
    needs: [changed-files, syntax-check, basic-tests, docker-tests, config-tests, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          CHANGED_FILES_RESULT: ${{ needs.changed-files.result }}
          RUN_SYNTAX_CHECK: ${{ needs.changed-files.outputs.run_syntax_check }}
          RUN_BASIC_TESTS: ${{ needs.changed-files.outputs.run_basic_tests }}
          RUN_TEMPLATE_TESTS: ${{ needs.changed-files.outputs.run_template_tests }}
          RUN_DOCKER_TESTS: ${{ needs.changed-files.outputs.run_docker_tests }}
          RUN_CONFIG_TESTS: ${{ needs.changed-files.outputs.run_config_tests }}
          RUN_LINT: ${{ needs.changed-files.outputs.run_lint }}
          SYNTAX_CHECK_RESULT: ${{ needs.syntax-check.result }}
          BASIC_TESTS_RESULT: ${{ needs.basic-tests.result }}
          DOCKER_TESTS_RESULT: ${{ needs.docker-tests.result }}
          CONFIG_TESTS_RESULT: ${{ needs.config-tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          # Detection itself must succeed. Test jobs may be skipped only when
          # the successful path filter established they are irrelevant.
          if [[ "${CHANGED_FILES_RESULT}" != "success" ]]; then
            echo "Changed-file detection did not succeed: ${CHANGED_FILES_RESULT}"
            exit 1
          fi
          check_result() {
            local name=$1 expected=$2 result=$3
            if [[ "${expected}" != "true" && "${expected}" != "false" ]]; then
              echo "${name} selector had invalid value: ${expected}"
              exit 1
            fi
            if [[ "${expected}" == "true" && "${result}" != "success" ]]; then
              echo "${name} was selected but ended as ${result}"
              exit 1
            fi
            if [[ "${expected}" == "false" && "${result}" != "skipped" ]]; then
              echo "${name} was not selected but ended as ${result}"
              exit 1
            fi
          }
          for selector in \
            "${RUN_SYNTAX_CHECK}" \
            "${RUN_BASIC_TESTS}" \
            "${RUN_TEMPLATE_TESTS}" \
            "${RUN_DOCKER_TESTS}" \
            "${RUN_CONFIG_TESTS}" \
            "${RUN_LINT}"; do
            if [[ "${selector}" != "true" && "${selector}" != "false" ]]; then
              echo "Changed-file selector had invalid value: ${selector}"
              exit 1
            fi
          done
          BASIC_EXPECTED=false
          if [[ "${RUN_BASIC_TESTS}" == "true" || "${RUN_TEMPLATE_TESTS}" == "true" ]]; then
            BASIC_EXPECTED=true
          fi
          check_result syntax "${RUN_SYNTAX_CHECK}" "${SYNTAX_CHECK_RESULT}"
          check_result basic "${BASIC_EXPECTED}" "${BASIC_TESTS_RESULT}"
          check_result docker "${RUN_DOCKER_TESTS}" "${DOCKER_TESTS_RESULT}"
          check_result config "${RUN_CONFIG_TESTS}" "${CONFIG_TESTS_RESULT}"
          check_result lint "${RUN_LINT}" "${LINT_RESULT}"
          echo "All selected required tests passed; unselected tests were skipped."

  trigger-integration:
    name: Trigger Integration Tests
    needs: changed-files
    if: |
      needs.changed-files.outputs.run_integration == 'true' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Trigger integration tests
        run: |
          echo "Integration tests should be triggered for this PR"
          echo "Changed files indicate potential breaking changes"
          echo "Run workflow manually: .github/workflows/integration-tests.yml"
