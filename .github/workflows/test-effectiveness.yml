---
name: Test Effectiveness Tracking

'on':
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:  # Allow manual runs

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  track-effectiveness:
    name: Analyze Test Effectiveness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Analyze test effectiveness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/track-test-effectiveness.py

      - name: Upload metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-effectiveness-metrics
          path: .metrics/

      - name: Publish report in the workflow summary
        run: |
          cat .metrics/test-effectiveness-report.md >> "$GITHUB_STEP_SUMMARY"
