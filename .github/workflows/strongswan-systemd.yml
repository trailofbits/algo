---
name: StrongSwan systemd hardening

'on':
  pull_request:
    paths:
      - 'roles/strongswan/**'
      - 'tests/integration/test-strongswan-systemd.sh'
      - '.github/workflows/strongswan-systemd.yml'
  push:
    branches: [main]
    paths:
      - 'roles/strongswan/**'
      - 'tests/integration/test-strongswan-systemd.sh'
      - '.github/workflows/strongswan-systemd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-2204-systemd:
    name: Ubuntu 22.04 StrongSwan systemd
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee  # v1
        with:
          channel: 5.21/stable

      - name: Run StrongSwan systemd regression harness
        run: tests/integration/test-strongswan-systemd.sh
