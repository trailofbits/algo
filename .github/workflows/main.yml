---
name: CI

'on':
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Pre-commit checks
    needs: dependency-audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run all hooks
        run: ./scripts/lint.sh

  tests:
    name: Python tests
    needs: dependency-audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - name: Sync dependencies
        run: uv sync --locked --all-extras
      - name: Install tested cloud collections
        run: >
          uv run --locked --all-extras
          ansible-galaxy collection install -r requirements.yml
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck wireguard-tools rsyslog
      - name: Run the full Python suite and Ansible smoke test
        env:
          ALGO_CLOUD_SMOKE: '1'
        run: uv run --locked --all-extras pytest -q

  powershell-lint:
    name: PowerShell lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check PowerShell with PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer |
              Where-Object Version -EQ '1.25.0')) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          }
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $results = Invoke-ScriptAnalyzer -Path ./algo.ps1 -Severity Warning,Error
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            exit 1
          }

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - name: Audit locked dependencies
        run: uv audit --locked

  docker-build:
    name: Docker build test
    needs: dependency-audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build Docker image
        run: docker build -t local/algo:test .
      - name: Check the container CLI and Ansible
        run: |
          docker run --rm local/algo:test /algo/algo --help
          docker run --rm local/algo:test uv run --locked --no-dev ansible-playbook --version
      - name: Verify config persistence after deployment failures
        # Linux bind mounts retain the fixture owner's UID; match the container's UID 0.
        run: sudo python3 tests/docker_wrapper.py local/algo:test
      - name: Validate firewall, DNS rebinding protection, and QR codes
        run: |
          docker run --rm --cap-add=NET_ADMIN \
            -e UV_NO_DEV=false -e ALGO_NETWORK_RUNTIME=1 \
            -v "$PWD/tests:/algo/tests:ro" \
            -v "$PWD/config.cfg:/algo/config.cfg:ro" \
            --entrypoint /bin/sh local/algo:test -ec '
              apk add --no-cache iptables dnscrypt-proxy zbar imagemagick
              uv run --locked pytest -q tests/network tests/test_wireguard_qr.py
            '

  all-tests-required:
    name: All Required Tests
    needs: [lint, tests, powershell-lint, dependency-audit, docker-build]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              echo "A required check did not pass: $result"
              exit 1
            fi
          done
