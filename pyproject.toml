[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "algo"
description = "Set up a personal IPSEC VPN in the cloud"
version = "2.0.0-beta"
requires-python = ">=3.12"
dependencies = [
    "ansible==14.6.0",
    "cryptography==50.0.2",
    "jinja2>=3.1.6",
    "netaddr==1.3.0",
    "pyyaml>=6.0.2",
    "segno>=1.6.0",
]

[tool.setuptools]
# Explicitly disable package discovery since Algo is not a Python package
py-modules = []

[project.optional-dependencies]
# Cloud provider dependencies (installed automatically based on provider selection)
aws = [
    "boto3==1.43.125",
]
# Keep these SDK pins aligned with azure.azcollection in requirements.yml.
# The collection imports all of these from azure_rm_common, even for ARM deployments.
azure = [
    "azure-cli-core==2.91.0",
    "azure-identity==1.25.2",
    "azure-mgmt-authorization==4.0.0",
    "azure-mgmt-automation==1.1.0b4",
    "azure-mgmt-batch==17.3.0",
    "azure-mgmt-cdn==13.1.1",
    "azure-mgmt-cognitiveservices==13.7.0",
    "azure-mgmt-compute==33.0.0",
    "azure-mgmt-appcontainers==5.0.0",
    "azure-mgmt-containerinstance==10.1.0",
    "azure-mgmt-containerregistry==10.3.0",
    "azure-mgmt-containerservice==32.1.0",
    "azure-mgmt-core==1.6.0",
    "azure-mgmt-datafactory==9.0.0",
    "azure-mgmt-databricks==2.0.0",
    "azure-mgmt-dataprotection==2.2.0",
    "azure-mgmt-dns==8.1.0",
    "azure-mgmt-eventhub==11.1.0",
    "azure-mgmt-iothub==3.0.0",
    "azure-mgmt-loganalytics==13.0.0b7",
    "azure-mgmt-hybridcompute==9.0.0",
    "azure-mgmt-managementgroups==1.1.0b2",
    "azure-mgmt-marketplaceordering==1.2.0b2",
    "azure-mgmt-monitor==6.0.2",
    "azure-mgmt-msi==7.1.0",
    "azure-mgmt-mysqlflexibleservers==1.0.0",
    "azure-mgmt-network==28.0.0",
    "azure-mgmt-notificationhubs==8.1.0b1",
    "azure-mgmt-postgresqlflexibleservers==2.0.0",
    "azure-mgmt-privatedns==1.2.0",
    "azure-mgmt-recoveryservices==4.2.0",
    "azure-mgmt-recoveryservicesbackup==9.1.0",
    "azure-mgmt-resource==23.2.0",
    "azure-mgmt-resourcehealth==1.0.0b6",
    "azure-mgmt-search==9.2.0b2",
    "azure-mgmt-servicebus==8.2.1",
    "azure-mgmt-sql==4.0.0b19",
    "azure-mgmt-storage==25.0.0",
    "azure-mgmt-trafficmanager==1.1.0",
    "azure-mgmt-web==7.3.1",
    "azure-storage-blob==12.23.0b1",
    "azure-storage-file-share==12.24.0",
    "msgraph-sdk==1.6.0",
]
gcp = [
    "google-auth==2.62.1",
    "requests>=2.34.2",
]
hetzner = [
    "hcloud==2.27.0",
]
linode = [
    "ansible-specdoc==0.0.20",
    "polling==0.3.2",
    "linode-api4==5.49.0",
]
openstack = [
    "openstacksdk==4.22.0",
]
cloudstack = [
    "cs==5.2.0",
]

[tool.ruff]
# Ruff configuration
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "ERA",  # commented-out code detection
    "PTH",  # pathlib recommendations
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B011",   # assert False is acceptable in test code
    "S101",   # assert is acceptable in test code
    "S110",   # try-except-pass - used intentionally for optional checks
    "S112",   # try-except-continue - used intentionally for skipping files
    "S603",   # subprocess calls - needed for Ansible modules
    "S607",   # partial path - needed for Ansible modules
    "S701",   # jinja2 autoescape - templates are for config files, not HTML
    "S602",   # shell=True in subprocess - needed for test mocks
    "SIM102", # nested if - sometimes clearer than combined conditions
    "SIM108", # ternary - sometimes if/else is more readable
    "ERA001", # commented code - some comments explain regex patterns
    "RUF005", # iterable unpacking - concatenation is clearer in some cases
    "PTH100", # pathlib - existing code uses os.path
    "PTH108", # pathlib - existing code uses os.unlink
    "PTH110", # pathlib - existing code uses os.path.exists
    "PTH118", # pathlib - existing code uses os.path.join
    "PTH119", # pathlib - existing code uses os.path.basename
    "PTH120", # pathlib - existing code uses os.path.dirname
    "PTH123", # pathlib - existing code uses open()
    "PTH201", # pathlib - existing code uses Path(".")
    "PTH207", # pathlib - existing code uses glob
]

[tool.ruff.lint.per-file-ignores]
"library/gcp_compute_location_info.py" = ["ALL"]  # Vendored cloud modules
"library/lightsail_region_facts.py" = ["ALL"]
"tests/*" = ["S101"]   # Allow assert in tests

[tool.ty.environment]
# Type checking configuration
python-version = "3.12"

[tool.ty.src]
# Exclude the two remaining vendored modules and tests; check Algo's own modules.
exclude = ["library/gcp_compute_location_info.py", "library/lightsail_region_facts.py", "tests/**"]

[tool.ty.rules]
# Optional cloud SDKs are not installed in the base environment.
import-not-found = "ignore"
unknown-argument = "warn"

[tool.uv]
exclude-newer = "7 days"
preview-features = ["audit-command"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",  # Parallel test execution
    "ruff==0.17.4",        # Python linter and formatter
    "yamllint==1.38.0",    # YAML linter
    "ansible-lint==26.11.0", # Ansible and embedded Jinja checks
    "j2lint==1.3.0",       # Jinja2 template linter
    "prek==0.5.10",        # Same hook runner locally and in CI
    "setuptools==84.2.1", # Audit the installed build tool
    "ty==0.0.98",         # Keep type checks stable across CI runs
    "hypothesis==6.170.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-p", "no:anyio",       # Cloud SDKs bring this plugin; Algo has no async tests.
    "-v",                   # Verbose output
    "--strict-markers",     # Strict marker validation
    "--strict-config",      # Strict config validation
    "--tb=short",          # Short traceback format
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
